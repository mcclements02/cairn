name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax
        run: bash -n cairn tests/cairn-smoke.sh templates/scripts/*.sh templates/githooks/pre-commit
      - name: Integration tests
        run: bash tests/cairn-smoke.sh
